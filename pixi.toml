[workspace]
channels = ["conda-forge"]
name = "pdf-profile-collection"
platforms = ["linux-64"]
version = "2026.2.0"

[system-requirements]
libc = "2.17"

[feature.profile.dependencies]
bluesky-base = "==1.15.0"
bluesky-queueserver = "*"
matplotlib-base= ">=3.10"
networkx = ">=3.4.2,<4"
nslsii = "==0.11.8"
numpy = "*"
ophyd = ">=1.11.0"
pyepics = "*"
python = ">=3.12,<3.14"
semver = ">=3.0.4,<4"
bluesky-darkframes = ">=0.6.0,<0.7"
xpdan = ">=0.8.2,<0.9"
lmfit = ">=1.3.4,<2"
databroker = "==2.0.0"
bluesky-tiled-plugins = "==2.0.2"
tifffile = ">=2025.5.10,<2026"
setuptools = "<81"
hdf5-external-filter-plugins = ">=0.1.0,<0.2"
blosc-hdf5-plugin = ">=1.0.1,<2"
epicscorelibs = ">=7.0.7.99.1.1,<8"
ophyd-async = ">=0.13.7,<0.14"
tiled-client = ">=0.2.9,<0.3"
xpdacq = "==1.0.0"

[feature.profile.pypi-dependencies]
pvxslibs = ">=1.3.2, <2"
#diffpy-pdfgetx = { path = "/opt/diffpy.pdfgetx-2.4.0/py312/diffpy_pdfgetx-2.4.0-cp312-cp312-linux_x86_64.whl" }
pdfstream = { git = "https://github.com/NSLS-II-PDF/pdfstream.git", rev="v0.5.x-xpd-datasec" }

[feature.qs.dependencies]
bluesky-queueserver = "*"
bluesky-httpserver = "*"

[feature.qs.tasks]
# This section needs some development work to understand the best way to
# thread the required configuration through both the task and files checked into
# the profile.  These will interact with the ansible roles for pushing out the
# systemd units
qs-backend = "start-re-manager --profile-dir=."
qs-server = "uvicorn --host localhost --port 60610 bluesky_httpserver.server:app"


[feature.terminal.dependencies]
ipython = ">=9.5.0"
pyside6 = "*"
numpy = ">2"


[feature.terminal.tasks]
start = "unset SESSION_MANAGER PYTHONPATH && MPLBACKEND=qtagg ipython --profile-dir=$HOME/.ipython/profile_$BS_PROFILE"
pvs = "ipython --profile-dir=. -c 'get_pv_types(); exit()'"
kafka = "python /home/xf28id1/.ipython/profile_collection/scripts/pdf_Kafka/kafka_server.py pdf pdf-analysis"


[environments]
terminal = {features=["profile", "terminal"], solve-group="profile"}
qs = {features=["profile", "qs"], solve-group="profile"}
